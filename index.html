<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laboratoire des Trouvailles</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --sage:       #EDF4EF;
            --sage-mid:   #C8E6D0;
            --forest:     #2A5C45;
            --forest-dk:  #1A3A2A;
            --mint:       #74C69D;
            --amber:      #F4A261;
            --amber-dk:   #E07830;
            --white:      #FFFFFF;
            --muted:      #6B8F71;
            --card-bdr:   rgba(42,92,69,.09);
            color-scheme: light;
        }
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Nunito', sans-serif;
            background: var(--sage);
            color: var(--forest-dk);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            overflow-x: hidden;
        }

        /* ── Молекулы фона ───────────────────────────────── */
        .particles { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
        .p { position: absolute; border-radius: 50%; background: var(--mint); animation: float linear infinite; }
        .p:nth-child(1)  { width:7px;  height:7px;  left:8%;  animation-duration:15s; animation-delay:0s;  opacity:.15; }
        .p:nth-child(2)  { width:4px;  height:4px;  left:22%; animation-duration:19s; animation-delay:3s;  opacity:.12; }
        .p:nth-child(3)  { width:10px; height:10px; left:38%; animation-duration:12s; animation-delay:5s;  opacity:.09; }
        .p:nth-child(4)  { width:5px;  height:5px;  left:54%; animation-duration:17s; animation-delay:1s;  opacity:.14; }
        .p:nth-child(5)  { width:8px;  height:8px;  left:68%; animation-duration:14s; animation-delay:7s;  opacity:.11; }
        .p:nth-child(6)  { width:3px;  height:3px;  left:82%; animation-duration:21s; animation-delay:4s;  opacity:.18; }
        .p:nth-child(7)  { width:6px;  height:6px;  left:14%; animation-duration:16s; animation-delay:9s;  opacity:.13; }
        .p:nth-child(8)  { width:9px;  height:9px;  left:58%; animation-duration:13s; animation-delay:6s;  opacity:.10; }
        @keyframes float {
            0%   { transform: translateY(105vh); opacity: 0; }
            8%   { opacity: .18; }
            92%  { opacity: .10; }
            100% { transform: translateY(-8vh);  opacity: 0; }
        }

        /* ── Страница ────────────────────────────────────── */
        .page {
            position: relative; z-index: 1;
            width: 100%; max-width: 440px;
            padding: 46px 20px 44px;
            display: flex; flex-direction: column; align-items: center;
        }

        /* ── Герой ────────────────────────────────────────── */
        .hero { display: flex; flex-direction: column; align-items: center; margin-bottom: 28px; animation: fadeUp .65s ease both; }
        @keyframes fadeUp { from { opacity:0; transform:translateY(-14px); } to { opacity:1; transform:translateY(0); } }

        .avatar-wrap { position: relative; width: 108px; height: 108px; margin-bottom: 16px; }
        .avatar-glow {
            position: absolute; inset: -10px; border-radius: 50%;
            background: radial-gradient(circle, rgba(116,198,157,.42) 0%, transparent 70%);
            animation: pulse 3s ease-in-out infinite;
        }
        @keyframes pulse { 0%,100%{transform:scale(1);opacity:.65;} 50%{transform:scale(1.15);opacity:1;} }
        .avatar-img {
            position: relative; width: 108px; height: 108px; border-radius: 50%;
            object-fit: cover; border: 3.5px solid var(--white);
            box-shadow: 0 8px 26px rgba(42,92,69,.20); display: block;
        }
        .avatar-badge {
            position: absolute; bottom: 2px; right: 2px;
            width: 27px; height: 27px; background: var(--white); border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 14px; box-shadow: 0 2px 8px rgba(0,0,0,.12);
        }
        .brand-name { font-size: 21px; font-weight: 900; letter-spacing: -.3px; color: var(--forest); text-align: center; line-height: 1.15; }
        .brand-sub  { font-size: 12.5px; font-weight: 500; color: var(--muted); margin-top: 5px; text-align: center; line-height: 1.45; }

        /* ── Главный хит ────────────────────────────────── */
        .featured {
            width: 100%;
            display: flex; align-items: center; gap: 13px;
            padding: 16px 18px; border-radius: 18px;
            text-decoration: none;
            background: linear-gradient(135deg, var(--amber) 0%, var(--amber-dk) 100%);
            box-shadow: 0 8px 24px rgba(244,162,97,.38);
            position: relative; overflow: hidden;
            transition: transform .22s ease, box-shadow .22s ease;
            margin-bottom: 22px;
            animation: fadeUp .5s ease .1s both;
        }
        .featured::before {
            content: ''; position: absolute; top:-45px; right:-45px;
            width:130px; height:130px; border-radius:50%; background:rgba(255,255,255,.10);
        }
        .featured:hover { transform: translateY(-3px); box-shadow: 0 14px 32px rgba(244,162,97,.48); }
        .featured:active { transform: translateY(-1px); }

        .featured-icon { font-size: 28px; flex-shrink: 0; }
        .featured-body { flex: 1; min-width: 0; }
        .featured-badge {
            display: inline-flex; align-items: center; gap: 4px;
            font-size: 10px; font-weight: 800;
            color: var(--amber-dk); background: var(--white);
            border-radius: 20px; padding: 2px 8px; margin-bottom: 5px;
        }
        .featured-title { font-size: 15px; font-weight: 800; color: #fff; line-height: 1.2; }
        .featured-sub   { font-size: 11.5px; font-weight: 500; color: rgba(255,255,255,.82); margin-top: 2px; }
        .featured-arrow {
            flex-shrink: 0; width: 32px; height: 32px; border-radius: 50%;
            background: rgba(255,255,255,.22); display: flex; align-items: center; justify-content: center;
            transition: background .2s, transform .2s;
        }
        .featured:hover .featured-arrow { background: rgba(255,255,255,.35); transform: translateX(2px); }
        .featured-arrow svg { width: 14px; height: 14px; fill: none; stroke: #fff; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }

        /* ── Вкладки ─────────────────────────────────────── */
        .tabs-wrap {
            width: 100%;
            animation: fadeUp .5s ease .18s both;
        }

        .tabs-nav {
            display: flex; gap: 6px;
            background: var(--white);
            border-radius: 14px; padding: 5px;
            box-shadow: 0 2px 8px rgba(42,92,69,.08);
            margin-bottom: 14px;
        }
        .tab-btn {
            flex: 1; display: flex; align-items: center; justify-content: center; gap: 5px;
            padding: 9px 6px; border-radius: 10px; border: none;
            background: transparent; cursor: pointer;
            font-family: 'Nunito', sans-serif;
            font-size: 12.5px; font-weight: 700;
            color: var(--muted);
            transition: background .2s, color .2s;
            -webkit-tap-highlight-color: transparent;
        }
        .tab-btn .tab-icon { font-size: 16px; }
        .tab-btn:hover { background: var(--sage); color: var(--forest); }
        .tab-btn.active {
            background: var(--forest);
            color: #fff;
            box-shadow: 0 3px 10px rgba(42,92,69,.22);
        }

        /* ── Список товаров ───────────────────────────────── */
        .tab-panel { display: none; flex-direction: column; gap: 10px; }
        .tab-panel.active { display: flex; animation: panelIn .3s ease both; }
        @keyframes panelIn { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }

        .prod-card {
            display: flex; align-items: center; gap: 13px;
            padding: 14px 16px; border-radius: 15px;
            text-decoration: none;
            background: var(--white);
            border: 1.5px solid var(--card-bdr);
            box-shadow: 0 2px 8px rgba(42,92,69,.06);
            transition: transform .2s ease, box-shadow .2s ease, border-color .2s ease;
            -webkit-tap-highlight-color: transparent;
        }
        .prod-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 22px rgba(42,92,69,.12);
            border-color: rgba(116,198,157,.45);
        }
        .prod-card:active { transform: translateY(0); }
        .prod-icon  { font-size: 24px; flex-shrink: 0; }
        .prod-body  { flex: 1; min-width: 0; }
        .prod-title { font-size: 13.5px; font-weight: 700; color: var(--forest-dk); line-height: 1.25; }
        .prod-sub   { font-size: 11.5px; font-weight: 500; color: var(--muted); margin-top: 2px; }
        .prod-arrow {
            flex-shrink: 0; width: 28px; height: 28px; border-radius: 50%;
            background: var(--sage); display: flex; align-items: center; justify-content: center;
            transition: background .2s, transform .2s;
        }
        .prod-card:hover .prod-arrow { background: var(--sage-mid); transform: translateX(2px); }
        .prod-arrow svg { width: 13px; height: 13px; fill: none; stroke: var(--forest); stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }

        /* Пусто */
        .empty { text-align: center; padding: 28px 16px; color: var(--muted); font-size: 13px; font-weight: 600; }
        .empty-icon { font-size: 32px; margin-bottom: 8px; display: block; }

        /* ── Подвал ───────────────────────────────────────── */
        .footer { margin-top: 30px; text-align: center; }
        .footer-brand { font-size: 13px; font-weight: 800; color: var(--forest); }
        .footer-copy  { font-size: 11px; color: var(--muted); margin-top: 3px; }
        .amz-tag {
            display: inline-block; font-size: 9.5px; font-weight: 700;
            background: rgba(42,92,69,.10); color: var(--forest);
            border-radius: 6px; padding: 2px 7px; margin-top: 6px;
        }

        .prod-card:focus-visible, .tab-btn:focus-visible, .featured:focus-visible
            { outline: 3px solid var(--mint); outline-offset: 3px; }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { animation: none !important; transition: none !important; }
            .tab-panel { display: none; }
            .tab-panel.active { display: flex; opacity: 1; }
            .featured, .tabs-wrap, .hero { opacity: 1 !important; transform: none !important; }
        }
    </style>
</head>
<body>

<div class="particles" aria-hidden="true">
    <div class="p"></div><div class="p"></div><div class="p"></div><div class="p"></div>
    <div class="p"></div><div class="p"></div><div class="p"></div><div class="p"></div>
</div>

<div class="page">

    <!-- Герой -->
    <div class="hero">
        <div class="avatar-wrap">
            <div class="avatar-glow" aria-hidden="true"></div>
            <img class="avatar-img"
                 src="https://i.ibb.co/kV0kdBsw/scene-2-1790350337391.jpg"
                 alt="Chercheuse Laboratoire des Trouvailles"
                 onerror="this.src='https://ui-avatars.com/api/?name=Lab&background=74C69D&color=fff&size=200'">
            <div class="avatar-badge" aria-hidden="true">🔬</div>
        </div>
        <h1 class="brand-name">Laboratoire<br>des Trouvailles</h1>
        <p class="brand-sub">La science au service de votre maison<br>@silom2000 · TikTok</p>
    </div>

    <!-- Главный хит (всегда виден) -->
    <a id="featured-link" href="#" class="featured" target="_blank" rel="nofollow noopener">
        <span class="featured-icon" id="featured-icon">💦</span>
        <span class="featured-body">
            <span class="featured-badge">⭐ Coup de cœur du labo</span>
            <span class="featured-title" id="featured-title">Extracteur portable BISSELL</span>
            <span class="featured-sub" id="featured-sub">Efface les taches de matelas &amp; canapé</span>
        </span>
        <span class="featured-arrow">
            <svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
        </span>
    </a>

    <!-- Вкладки -->
    <div class="tabs-wrap">
        <nav class="tabs-nav" role="tablist" aria-label="Catégories de produits">
            <button class="tab-btn active" role="tab" data-tab="nettoyage" aria-selected="true">
                <span class="tab-icon">🧹</span> Nettoyage
            </button>
            <button class="tab-btn" role="tab" data-tab="jardin" aria-selected="false">
                <span class="tab-icon">🌱</span> Jardin
            </button>
            <button class="tab-btn" role="tab" data-tab="beaute" aria-selected="false">
                <span class="tab-icon">🌿</span> Beauté
            </button>
        </nav>

        <div id="panel-nettoyage" class="tab-panel active" role="tabpanel"></div>
        <div id="panel-jardin"    class="tab-panel" role="tabpanel"></div>
        <div id="panel-beaute"    class="tab-panel" role="tabpanel"></div>
    </div>

    <footer class="footer">
        <div class="footer-brand">Laboratoire des Trouvailles</div>
        <div class="footer-copy">© 2026 · Astuces testées &amp; approuvées</div>
        <div><span class="amz-tag">Liens Amazon partenaires</span></div>
    </footer>

</div>

<script>
/* ════════════════════════════════════════════════════
   ДАННЫЕ ПРОДУКТОВ — добавляйте новые строки сюда!
   Поля: icon, title, sub, url
   featured: true → этот товар всегда наверху
════════════════════════════════════════════════════ */
const PRODUCTS = {

    nettoyage: [
        {
            icon:     '💦',
            title:    'Extracteur portable BISSELL',
            sub:      'Efface les taches de matelas & canapé en quelques secondes',
            url:      'https://amzn.to/4xIYZza',
            featured: true          // ← этот товар показывается как главный хит
        },
        {
            icon:  '🧹',
            title: 'Brosse de nettoyage électrique',
            sub:   'Joints parfaits sans effort',
            url:   'https://amzn.to/4yW8hZA'
        },
        // Добавьте новый товар так:
        // { icon: '🪣', title: 'Nom du produit', sub: 'Description courte', url: 'https://amzn.to/XXXXX' },
    ],

    jardin: [
        {
            icon:  '🐌',
            title: 'Ruban en cuivre anti-limaces',
            sub:   'Stop limaces sans poison !',
            url:   'https://amzn.to/3V8MkYU'
        },
        // { icon: '🌸', title: 'Nom du produit', sub: 'Description courte', url: 'https://amzn.to/XXXXX' },
    ],

    beaute: [
        {
            icon:  '🌿',
            title: 'Gel d\'Aloe Vera Bio 100%',
            sub:   'Le secret pour des cheveux magnifiques',
            url:   'https://amzn.to/4rxiNnO'
        },
        // { icon: '💆', title: 'Nom du produit', sub: 'Description courte', url: 'https://amzn.to/XXXXX' },
    ]
};

/* ── Рендеринг ──────────────────────────────────── */
function arrowSVG() {
    return `<svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg>`;
}

function renderProducts() {
    let featuredSet = false;

    for (const [cat, items] of Object.entries(PRODUCTS)) {
        const panel = document.getElementById('panel-' + cat);
        if (!panel) continue;
        panel.innerHTML = '';

        const nonFeatured = items.filter(p => !p.featured);

        if (nonFeatured.length === 0) {
            panel.innerHTML = `<div class="empty"><span class="empty-icon">🔭</span>D'autres trouvailles arrivent bientôt !</div>`;
        } else {
            nonFeatured.forEach(p => {
                const a = document.createElement('a');
                a.href = p.url;
                a.target = '_blank';
                a.rel = 'nofollow noopener';
                a.className = 'prod-card';
                a.innerHTML = `
                    <span class="prod-icon">${p.icon}</span>
                    <span class="prod-body">
                        <span class="prod-title">${p.title}</span>
                        <span class="prod-sub">${p.sub}</span>
                    </span>
                    <span class="prod-arrow">${arrowSVG()}</span>`;
                panel.appendChild(a);
            });
        }

        // Главный хит — берём первый попавшийся с featured:true
        if (!featuredSet) {
            const f = items.find(p => p.featured);
            if (f) {
                document.getElementById('featured-link').href = f.url;
                document.getElementById('featured-icon').textContent = f.icon;
                document.getElementById('featured-title').textContent = f.title;
                document.getElementById('featured-sub').textContent = f.sub;
                featuredSet = true;
            }
        }
    }
}

/* ── Вкладки ────────────────────────────────────── */
document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.addEventListener('click', () => {
        const tab = btn.dataset.tab;

        document.querySelectorAll('.tab-btn').forEach(b => {
            b.classList.toggle('active', b === btn);
            b.setAttribute('aria-selected', b === btn ? 'true' : 'false');
        });
        document.querySelectorAll('.tab-panel').forEach(p => {
            p.classList.toggle('active', p.id === 'panel-' + tab);
        });
    });
});

renderProducts();
</script>
</body>
</html>
